<!-- Generic team crest: the fallback when a team has no logo, or its logo cannot be
     fetched or is rejected by the content-type allowlist. Deliberately NOT the player
     silhouette used for headshots — a person-shaped placeholder for a team reads as a
     missing manager rather than a missing logo.

     This file is bundled application content, not user-supplied, so serving it as SVG
     carries none of the same-origin script risk that gates uploaded logos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="No team logo">
  <path d="M24 3 6 9v15c0 10.5 7.4 18.6 18 21 10.6-2.4 18-10.5 18-21V9L24 3z"
        fill="#2A2A2E" stroke="#48484E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 14v20M15 20h18" stroke="#6A6A72" stroke-width="2.5" stroke-linecap="round"/>
</svg>
