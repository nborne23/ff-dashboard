[project]
name = "gridiron"
version = "0.1.0"
description = "Single-user fantasy football dashboard aggregating Yahoo + ESPN leagues"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "sse-starlette>=2.1",
    "cryptography>=43,<49",
    "authlib>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "black>=24",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.setuptools]
packages = { find = { where = ["backend"] } }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
